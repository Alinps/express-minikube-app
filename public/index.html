<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Express + Minikube</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Hello from Kubernetes!</h1>

        <p>
            This is a simple static webpage served using Express.js.
        </p>

        <div class="card">

            <h2>My First Kubernetes Application</h2>

            <p>Application: Express.js</p>

            <p>Runtime: Node.js</p>

            <p>Container: Docker</p>

            <p>Orchestration: Kubernetes</p>

            <p>Environment: Minikube</p>

        </div>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Congratulations! Your application is running in Minikube.";
        }
    </script>

</body>

</html>
