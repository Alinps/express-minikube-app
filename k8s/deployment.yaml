apiVersion: apps/v1

kind: Deployment

metadata:
  name: express-deployment

spec:

  replicas: 3

  selector:
    matchLabels:
      app: express-app

  template:

    metadata:
      labels:
        app: express-app

    spec:

      containers:

        - name: express-container

          image: express-minikube-app:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"